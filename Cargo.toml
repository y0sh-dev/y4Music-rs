[package]
name = "y4music-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dashmap = "6.2.1"
dotenvy = "0.15.7"
poise = "0.6.2"
# Only used for `/shuffle` (Fisher-Yates over the queue tail).
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "rustls_backend",
    "utils",
] }
songbird = { version = "0.6.0", features = ["driver", "gateway", "builtin-queue"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
# Direct dependency (unused directly) to enable container/codec features on
# songbird's shared symphonia instance via Cargo feature unification.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
tokio = { version = "1.53.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
opt-level = 3
strip = true
